<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Dear Our Love 모바일 초대장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--navy:#1b2a55;--gold:#b8923f;--cream:#efe8de}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--cream);overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;font-family:'Noto Serif KR',serif;color:var(--navy)}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--cream)}
.title{text-align:center;animation:fadeIn 1s both}
.title .en{font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:clamp(34px,11vw,56px);color:var(--gold);line-height:1.1}
.title .ko{margin-top:14px;font-size:clamp(16px,5vw,22px);letter-spacing:.12em}
.title .tap{margin-top:46px;font-size:12px;opacity:.55;letter-spacing:.2em;animation:pulse 2s infinite}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{opacity:.2}}
.cardwrap{width:min(92vw,560px,calc((100dvh - 190px)*1.36));aspect-ratio:1021/750;perspective:1400px;position:relative;opacity:0;transform:translateY(14px) scale(.97);transition:opacity .6s,transform .6s}
.cardwrap.show{opacity:1;transform:none}
.card{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;transition:transform .95s cubic-bezier(.45,.1,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px;overflow:hidden;box-shadow:0 14px 40px rgba(27,42,85,.3);background:#fff}
.face img{width:100%;height:100%;display:block;pointer-events:none}
.back{transform:rotateY(180deg)}
.sigc{position:absolute;inset:0;width:100%;height:100%;mix-blend-mode:multiply;pointer-events:none}
.lovehit{position:absolute;left:28%;top:43%;width:44%;height:21%;background:transparent;border:1.5px dashed rgba(27,42,85,.5);border-radius:8px;padding:0;cursor:pointer;animation:pulse 1.8s infinite}
.lovehit.signed{border-color:transparent;animation:none}
.under{margin-top:22px;min-height:96px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.hint{font-size:13px;opacity:.7;letter-spacing:.04em;transition:opacity .5s}
.btn{font-family:inherit;font-size:16px;letter-spacing:.1em;border:0;border-radius:999px;padding:14px 34px;background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(27,42,85,.3)}
.btn.ghost{background:transparent;color:var(--navy);box-shadow:none;border:1.5px solid var(--navy)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.4}
.overlay{position:fixed;inset:0;z-index:20;background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.overlay h2{margin:0;font-size:17px;font-weight:600;letter-spacing:.08em}
.overlay p{margin:0;font-size:12px;opacity:.6}
.board{position:relative;width:min(94vw,560px);aspect-ratio:540/193;box-shadow:0 12px 34px rgba(27,42,85,.25);border-radius:10px;overflow:hidden;background:#fff;border:1px solid #d9d4ca}
.board .gl{position:absolute;left:8%;right:8%;bottom:26%;border-bottom:1px dashed rgba(27,42,85,.25);pointer-events:none}
.board .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;letter-spacing:.2em;color:rgba(27,42,85,.22);pointer-events:none}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.row{display:flex;gap:12px}
#sheetBg{position:fixed;inset:0;z-index:30;background:rgba(10,16,36,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet{width:min(100%,520px);background:#fff;border-radius:18px 18px 0 0;padding:22px 20px 26px;display:flex;flex-direction:column;gap:12px;animation:up .35s both}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
#sheet h3{margin:0;font-size:17px}
#sheet textarea{width:100%;height:96px;resize:none;font-size:12px;word-break:break-all;border:1px solid #cfd3df;border-radius:10px;padding:10px;font-family:monospace;color:#333;-webkit-user-select:text;user-select:text}
#sheet .note{font-size:12px;opacity:.65;margin:0;line-height:1.5}
#fx{position:fixed;inset:0;z-index:50;pointer-events:none}
#toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:60;background:rgba(27,42,85,.92);color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1}
#vclose{position:fixed;top:14px;right:14px;z-index:25}
</style>
</head>
<body>

<!-- 제작 화면 -->
<div id="maker" class="screen">
  <div id="mTitle" class="title">
    <div class="en">Dear Our Love</div>
    <div class="ko">모바일 초대장 제작</div>
    <div class="tap">TOUCH</div>
  </div>
  <div id="mStage" class="hidden" style="display:flex;flex-direction:column;align-items:center">
    <div id="mCard"></div>
    <div class="under" id="bar">
      <div class="hint" id="mHint">LOVE 글자를 터치해 서명해 주세요</div>
      <button class="btn" id="mMake">링크 제작</button>
    </div>
  </div>
</div>

<!-- 초대장 화면 -->
<div id="viewer" class="screen hidden">
  <button class="btn ghost hidden" id="vclose" style="padding:8px 16px;font-size:13px">미리보기 닫기</button>
  <div id="vCard"></div>
  <div class="under"><div class="hint" id="vHint">&nbsp;</div></div>
</div>

<!-- 서명 화면 -->
<div id="sign" class="overlay hidden">
  <h2>서명해 주세요</h2>
  <div class="board"><div class="gl"></div><span class="ph">여기에 서명</span><canvas id="pad"></canvas></div>
  <p>쓴 서명은 카드의 LOVE 글자 위에 올라가요</p>
  <div class="row">
    <button class="btn ghost" id="padClear">지우기</button>
    <button class="btn" id="padDone">서명 완료</button>
  </div>
</div>

<!-- 링크 시트 -->
<div id="sheetBg" class="hidden">
  <div id="sheet">
    <h3>초대장 링크가 만들어졌어요</h3>
    <textarea id="linkBox" readonly></textarea>
    <p class="note" id="linkNote"></p>
    <div class="row" style="justify-content:flex-end">
      <button class="btn ghost" id="sPreview" style="padding:12px 20px;font-size:14px">미리보기</button>
      <button class="btn" id="sCopy" style="padding:12px 24px;font-size:14px">링크 복사</button>
    </div>
    <button class="btn ghost" id="sClose" style="border:0;padding:6px;font-size:13px;opacity:.6;box-shadow:none;background:none;color:#1b2a55">닫기</button>
  </div>
</div>

<canvas id="fx"></canvas>
<div id="toast"></div>

function drawStrokes(cv, strokes, lw){
  var c=cv.getContext('2d'); c.clearRect(0,0,cv.width,cv.height);
  c.strokeStyle='#0a0a0a'; c.fillStyle='#0a0a0a'; c.lineWidth=lw; c.lineCap='round'; c.lineJoin='round';
  strokes.forEach(function(s){
    if(!s.length) return;
    if(s.length===1){c.beginPath();c.arc(s[0].x,s[0].y,lw/2,0,6.2832);c.fill();return;}
    c.beginPath(); c.moveTo(s[0].x,s[0].y);
    for(var i=1;i<s.length-1;i++){
      var mx=(s[i].x+s[i+1].x)/2,my=(s[i].y+s[i+1].y)/2;
      c.quadraticCurveTo(s[i].x,s[i].y,mx,my);
    }
    var l=s[s.length-1]; c.lineTo(l.x,l.y); c.stroke();
  });
}
function simplify(strokes,minD){
  return strokes.map(function(s){
    var out=[],last=null;
    s.forEach(function(p,i){
      if(!last||Math.hypot(p.x-last.x,p.y-last.y)>=minD||i===s.length-1){
        if(!last||p.x!==last.x||p.y!==last.y||s.length===1){out.push(p);last=p;}
      }
    });
    return out;
  }).filter(function(s){return s.length});
}
function quantize(strokes){
  var minD=4,q;
  for(;;){
    var sim=simplify(strokes,minD),n=0;
    sim.forEach(function(s){n+=s.length});
    q=sim.map(function(s){return s.map(function(p){
      return [Math.max(0,Math.min(255,Math.round(p.x/PW*255))),Math.max(0,Math.min(255,Math.round(p.y/PH*255)))];
    })});
    if(n<=700||minD>60) break;
    minD+=2;
  }
  return q;
}
function dequant(q,w,h,ox,oy){return q.map(function(s){return s.map(function(p){return {x:ox+p[0]*w/255,y:oy+p[1]*h/255}})})}
function toCard(q){return dequant(q,RW,RH,RX,RY)}
function toPad(q){return dequant(q,PW,PH,0,0)}
var AL='abcdefghijklmnopqrstuvwxyz234567';
function encode(q){
  var b=[];
  q.forEach(function(s){
    for(var i=0;i<s.length;i+=254){
      var ch=s.slice(i,i+255); if(ch.length<1) break;
      b.push(ch.length); ch.forEach(function(p){b.push(p[0],p[1])});
      if(i+255>=s.length) break;
    }
  });
  b.push(0);
  var bits=0,val=0,out='';
  b.forEach(function(x){val=(val<<8)|x;bits+=8;while(bits>=5){out+=AL[(val>>>(bits-5))&31];bits-=5;}val&=(1<<bits)-1;});
  if(bits>0) out+=AL[(val<<(5-bits))&31];
  return out;
}
function decode(str){
  try{
    var b=[],bits=0,val=0;
    for(var i=0;i<str.length;i++){
      var k=AL.indexOf(str[i]); if(k<0) return null;
      val=(val<<5)|k;bits+=5;
      if(bits>=8){b.push((val>>>(bits-8))&255);bits-=8;val&=(1<<bits)-1;}
    }
    var q=[],i2=0;
    while(i2<b.length){
      var n=b[i2++]; if(n===0) break;
      var s=[]; for(var j=0;j<n;j++){ if(i2+1>=b.length) return null; s.push([b[i2],b[i2+1]]);i2+=2;}
      q.push(s);
    }
    return q;
  }catch(e){return null}
}

/* 서명 화면 */
var pad=$('#pad'), pStrokes=[], drawing=false;
pad.width=PW; pad.height=PH;
function openSign(){
  pStrokes=sigQ?toPad(sigQ):[];
  drawStrokes(pad,pStrokes,4);
  $('.board .ph').style.display=pStrokes.length?'none':'flex';
  $('#sign').classList.remove('hidden');
}
function pos(e){var r=pad.getBoundingClientRect();return {x:(e.clientX-r.left)/r.width*PW,y:(e.clientY-r.top)/r.height*PH}}
pad.addEventListener('pointerdown',function(e){
  e.preventDefault(); try{pad.setPointerCapture(e.pointerId)}catch(_){}
  drawing=true; pStrokes.push([pos(e)]); $('.board .ph').style.display='none'; drawStrokes(pad,pStrokes,4);
});
pad.addEventListener('pointermove',function(e){
  if(!drawing) return; e.preventDefault();
  var s=pStrokes[pStrokes.length-1],p=pos(e),l=s[s.length-1];
  if(Math.hypot(p.x-l.x,p.y-l.y)<2) return;
  s.push(p); drawStrokes(pad,pStrokes,4);
});
function endDraw(){drawing=false}
pad.addEventListener('pointerup',endDraw);pad.addEventListener('pointercancel',endDraw);
$('#padClear').onclick=function(){pStrokes=[];$('.board .ph').style.display='flex';drawStrokes(pad,pStrokes,4)};
$('#padDone').onclick=function(){
  if(!pStrokes.length){toast('서명을 먼저 해주세요');return}
  sigQ=quantize(pStrokes);
  drawStrokes(mSig,toCard(sigQ),6);
  hit.classList.add('signed');
  $('#mHint').textContent='서명이 카드에 담겼어요 · 다시 쓰려면 LOVE를 터치';
  $('#sign').classList.add('hidden');
};
hit.addEventListener('click',function(){openSign()});

  $('#sheetBg').classList.add('hidden');
  showViewer(sigQ,true);
};

/* ---------- 초대장(수신) 흐름 ---------- */
var vstate='blue', isPreview=false;
function showViewer(q,preview){
  isPreview=!!preview; mode='viewer';
  $('#maker').classList.add('hidden'); $('#viewer').classList.remove('hidden');
  $('#vclose').classList.toggle('hidden',!preview);
  vInner.classList.remove('flipped'); vWrap.classList.remove('show'); vstate='blue';
  $('#vHint').innerHTML='&nbsp;'; clearHearts();
  drawStrokes(vSig,q?toCard(q):[],6);
  requestAnimationFrame(function(){requestAnimationFrame(function(){vWrap.classList.add('show')})});
  setTimeout(function(){if(vstate==='blue')$('#vHint').textContent='카드를 터치해 보세요'},900);
  lock(500);
}
$('#vclose').onclick=function(){mode='maker';$('#viewer').classList.add('hidden');$('#maker').classList.remove('hidden');clearHearts()};
function viewerTap(e){
  if(locked) return;
  if(vstate==='blue'){
    vstate='white'; lock(1000); vInner.classList.add('flipped');
    $('#vHint').style.opacity=0;
    setTimeout(function(){$('#vHint').textContent='화면을 터치해 보세요 ♥';$('#vHint').style.opacity=.7},1100);
  }else{
    if(vstate==='white'){vstate='play';$('#vHint').style.opacity=0}
    spawn(e.clientX);
  }
}

/* ---------- 8bit 하트 ---------- */
var SPR=[
 '.HX.XX.',
 'HXXXXXX',
 'XXXXXXX',
 '.XXXXX.',
 '..XXX..',
 '...X...'];
var PAL=[
 ['#9c6137','#c98e5f','#4a2a17'],
 ['#5a2e1d','#8a553c','#24110a'],
 ['#f6e6cf','#ffffff','#a9825a'],
 ['#e07a93','#f6b0c1','#8e3a50'],
 ['#c8873d','#ebb976','#6b3f16'],
 ['#7b4b33','#a97756','#34190e']];
function makeSprite(p){
  var sw=9,sh=8,c=document.createElement('canvas');c.width=sw;c.height=sh;var g=c.getContext('2d');
  var f=[];for(var y=0;y<6;y++){f[y]=[];for(var x=0;x<7;x++)f[y][x]=SPR[y][x]}
  function on(x,y){return x>=0&&y>=0&&x<7&&y<6&&f[y][x]!=='.'}
  for(var y2=-1;y2<=6;y2++)for(var x2=-1;x2<=7;x2++){
    if(!on(x2,y2)&&(on(x2-1,y2)||on(x2+1,y2)||on(x2,y2-1)||on(x2,y2+1))){g.fillStyle=p[2];g.fillRect(x2+1,y2+1,1,1)}
  }
  for(var y3=0;y3<6;y3++)for(var x3=0;x3<7;x3++){
    if(f[y3][x3]==='.')continue; g.fillStyle=f[y3][x3]==='H'?p[1]:p[0]; g.fillRect(x3+1,y3+1,1,1);
  }
  return c;
}
var sprites=PAL.map(makeSprite);
var fx=$('#fx'),fc=fx.getContext('2d'),hearts=[],raf=0,dpr=1,last=0;
function sizeFx(){dpr=Math.min(window.devicePixelRatio||1,3);fx.width=innerWidth*dpr;fx.height=innerHeight*dpr}
sizeFx();addEventListener('resize',sizeFx);
function spawn(tx){
  var n=10;
  for(var i=0;i<n;i++){
    var s=[2,3,3,4,4,5][Math.floor(Math.random()*6)];
    hearts.push({sp:sprites[Math.floor(Math.random()*sprites.length)],s:s,
      x:tx+(Math.random()*2-1)*120,y:-30-Math.random()*240,
      vy:60+Math.random()*110,ay:240+Math.random()*120,
      ph:Math.random()*6.28,fr:1.5+Math.random()*2,am:6+Math.random()*14,bx:0});
    hearts[hearts.length-1].bx=hearts[hearts.length-1].x;
  }
  if(hearts.length>320) hearts.splice(0,hearts.length-320);
  if(!raf){last=performance.now();raf=requestAnimationFrame(loop)}
}
function loop(t){
  var dt=Math.min(.05,(t-last)/1000);last=t;
  fc.setTransform(dpr,0,0,dpr,0,0);fc.clearRect(0,0,innerWidth,innerHeight);fc.imageSmoothingEnabled=false;
  for(var i=hearts.length-1;i>=0;i--){
    var h=hearts[i];h.vy+=h.ay*dt;h.y+=h.vy*dt;h.ph+=h.fr*dt;
    var x=h.bx+Math.sin(h.ph)*h.am;
    if(h.y>innerHeight+60){hearts.splice(i,1);continue}
    fc.drawImage(h.sp,Math.round(x/h.s)*h.s,Math.round(h.y/h.s)*h.s,9*h.s,8*h.s);
  }
  if(hearts.length)raf=requestAnimationFrame(loop);else{raf=0;fc.clearRect(0,0,innerWidth,innerHeight)}
}
function clearHearts(){hearts.length=0}

/* ---------- 공통 터치 / 라우팅 ---------- */
document.addEventListener('pointerdown',function(e){
  if(e.target.closest('#sign,#sheetBg,#bar,.lovehit,#vclose')) return;
  if(mode==='maker')makerTap();else viewerTap(e);
});
function route(){
  var h=location.hash;
  if(h.indexOf('#inv-')===0){
    var q=decode(h.slice(5));
    if(q){showViewer(q,false);return}
    toast('초대장 링크가 올바르지 않아요');
  }
}
addEventListener('hashchange',route);
route();
})();
</script>
